name: Update data

on:
  schedule:
    - cron: "30 4 * * *"   # daily ~06:30–07:30 Finnish time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Each source is fetched separately; a failing source keeps yesterday's cache.
      - name: Polls
        id: polls
        run: python scripts/fetch_polls.py
        continue-on-error: true
      - name: Election results
        id: elections
        run: python scripts/fetch_elections.py
        continue-on-error: true
      - name: Parliament votes
        id: votes
        run: python scripts/fetch_votes.py
        continue-on-error: true
      - name: Citizens' initiatives
        id: initiatives
        run: python scripts/fetch_initiatives.py
        continue-on-error: true
      - name: Economy (Eurostat)
        id: economy
        run: python scripts/fetch_economy.py
        continue-on-error: true
      - name: Build site data
        run: python scripts/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Päivitä data $(date -u +%Y-%m-%d)"
          git push
      # Fail the run (so GitHub notifies) if any source failed, after saving what did update.
      - name: Report failed sources
        if: always()
        run: |
          failed=""
          [ "${{ steps.polls.outcome }}" = failure ] && failed="$failed polls"
          [ "${{ steps.elections.outcome }}" = failure ] && failed="$failed elections"
          [ "${{ steps.votes.outcome }}" = failure ] && failed="$failed votes"
          [ "${{ steps.initiatives.outcome }}" = failure ] && failed="$failed initiatives"
          [ "${{ steps.economy.outcome }}" = failure ] && failed="$failed economy"
          if [ -n "$failed" ]; then echo "::error::Failed sources:$failed"; exit 1; fi
          echo "All sources OK"
